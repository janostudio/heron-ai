id: auto_bugfix_multi_agent_smoke
entry: diagnose

teams:
  diagnose:
    team: diagnose_team
    coordinator: true
    inputs:
      user_message: true
    on_proceed: [review]

  review:
    team: collab_review_team
    depends_on: [diagnose]
    inputs:
      flow_records:
        - GitSnapshot
        - ExplorationReport
        - DiagnosisReport
    on_proceed:
      action: complete
