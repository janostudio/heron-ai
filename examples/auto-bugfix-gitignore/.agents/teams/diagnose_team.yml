id: diagnose_team
goal: 通过确定性 Git 快照、只读探索和根因分析，形成可验证的 .gitignore 诊断。
memory:
  enabled: true
  max_items: 20
  max_chars: 12000

calls:
  git_snapshot:
    type: command
    command:
      command: "bash .agents/scripts/git_snapshot.sh"
      timeout: 30s
      idempotency_key: "diagnose-git-${flow_turn_id}"
      replay_policy: idempotent
    inputs:
      user_message: true
    output:
      record: GitSnapshot

  explorer:
    type: subagent
    agent: explorer
    responsibility: 只读检查 project/.gitignore、项目文件和生成目录，输出 ExplorationReport。
    inputs:
      user_message: true
    output:
      record: ExplorationReport

  inspect:
    type: subagent
    agent: root-cause-analyst
    depends_on: [git_snapshot, explorer]
    responsibility: 综合 GitSnapshot 和 ExplorationReport，按根因分析规范形成 DiagnosisReport，不修改文件。
    inputs:
      user_message: true
      flow_records: [GitSnapshot, ExplorationReport, ChallengeReport]
    output:
      record: DiagnosisReport

output:
  records:
    - from: git_snapshot
      record: GitSnapshot
      scope: flow
    - from: explorer
      record: ExplorationReport
      scope: flow
    - from: inspect
      record: DiagnosisReport
      scope: flow
