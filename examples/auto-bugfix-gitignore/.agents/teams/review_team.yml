id: review_team
goal: 审查实际 .gitignore 变更是否最小、正确且通过验证。
memory:
  enabled: true
  max_items: 20
  max_chars: 8000

calls:
  review:
    type: subagent
    agent: code-reviewer
    responsibility: 对照 ChangeSet、VerificationReport 和 GitStatusReport 审查实际变更，输出 ReviewReport。
    inputs:
      flow_records: [ChangeSet, VerificationReport, GitStatusReport, TestDecision]
    output:
      record: ReviewReport

output:
  from: review
  record: ReviewReport
  scope: flow
