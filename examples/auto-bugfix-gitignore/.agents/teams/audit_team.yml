id: audit_team
goal: 对本次 Flow 的 session.jsonl、evidence.jsonl 和 SharedRecord 做只读观测。
memory:
  enabled: true
  max_items: 20
  max_chars: 8000

calls:
  snapshot:
    type: command
    command:
      command: "python3 .agents/scripts/analyze_session.py"
      env:
        HERON_FLOW_SESSION_ID: "${flow_session_id}"
      timeout: 30s
      idempotency_key: "session-audit-${flow_turn_id}"
      replay_policy: idempotent
    inputs:
      user_message: true
      flow_records: [KnowledgePersisted]
    output:
      record: AuditSnapshot

  inspect:
    type: subagent
    agent: audit-agent
    depends_on: [snapshot]
    responsibility: 解释 AuditSnapshot，确认本次真实运行的 Team、Member 和 SharedRecord。
    inputs:
      flow_records: [AuditSnapshot, KnowledgePersisted, ReviewReport]
    output:
      record: AuditReport

output:
  records:
    - from: snapshot
      record: AuditSnapshot
      scope: flow
    - from: inspect
      record: AuditReport
      scope: flow
