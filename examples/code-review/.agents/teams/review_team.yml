id: review_team
goal: 安全和性能并行审查，最后生成综合报告。

members:
  security_review:
    type: subagent
    agent: security-reviewer
    responsibility: 审查输入代码的安全漏洞，包括注入、敏感信息、加密和权限问题。
    inputs:
      user_message: true
    output:
      record: SecurityReview

  performance_review:
    type: subagent
    agent: performance-reviewer
    responsibility: 审查输入代码的性能、并发、资源释放和数据库访问问题。
    inputs:
      user_message: true
    output:
      record: PerformanceReview

  aggregate:
    type: subagent
    agent: lead-reviewer
    depends_on: [security_review, performance_review]
    responsibility: 综合安全和性能审查结果，生成最终代码审查报告。
    inputs:
      - from: security_review
        record: SecurityReview
      - from: performance_review
        record: PerformanceReview
    output:
      record: CodeReviewReport

output:
  from: aggregate
  record: CodeReviewReport
