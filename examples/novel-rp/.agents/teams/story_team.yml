id: story_team
goal: 推进当前小说剧情。

calls:
  hero_act:
    type: subagent
    agent: hero
    responsibility: 根据当前剧情描述主角的行动和对话。
    inputs:
      team_user_message: true
    output:
      record: HeroAction

  villain_act:
    type: subagent
    agent: villain
    responsibility: 根据当前剧情描述反派的行动和对话。
    inputs:
      team_user_message: true
    output:
      record: VillainAction

  narrate:
    type: subagent
    agent: narrator
    depends_on: [hero_act, villain_act]
    responsibility: 综合主角和反派的行动，推进剧情并输出旁白。
    inputs:
      - from: hero_act
        record: HeroAction
      - from: villain_act
        record: VillainAction
    output:
      record: StoryTurn

output:
  from: narrate
  record: StoryTurn
  scope: flow
