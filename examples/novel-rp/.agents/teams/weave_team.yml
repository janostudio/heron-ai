id: weave_team
goal: 旁白把各车道演绎编织成本轮正文 StoryTurn，作为回合终止节点输出给用户。
state:
  enabled: true
  max_items: 20
  max_chars: 12000
calls:
  narrate:
    type: agent
    agent: narrator
    responsibility: 综合本轮 ScenePlan 与各车道 RolePerformances，编织成连贯正文并输出 StoryTurn。
    inputs:
      flow_records: [ScenePlan, RolePerformances]
    output:
      record: StoryTurn
output:
  from: narrate
  record: StoryTurn
  scope: flow
