id: novel_story
entry: lobby

teams:
  lobby:
    team: lobby_team
    coordinator: true
    can_activate: [perform]
    inputs:
      user_message: true
      flow_records: [ScenePlan, RolePerformances, StoryTurn, TeamFailureReport]

  perform:
    team: perform_team
    depends_on: [lobby]
    inputs:
      flow_records: [ScenePlan]
    on_proceed: [weave]

  weave:
    team: weave_team
    depends_on: [perform]
    inputs:
      flow_records: [ScenePlan, RolePerformances]
