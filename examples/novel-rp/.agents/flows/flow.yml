id: novel_story
entry: opening

teams:
  opening:
    team: story_team
    coordinator: true
    inputs:
      user_message: true
    on_proceed: [development]

  development:
    team: story_team
    depends_on: [opening]
    inputs:
      user_message: true
    on_proceed: [climax]

  climax:
    team: story_team
    depends_on: [development]
    inputs:
      user_message: true
    on_proceed: [ending]

  ending:
    team: story_team
    depends_on: [climax]
    inputs:
      user_message: true
    on_proceed:
      action: complete
