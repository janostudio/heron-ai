id: blog_writer_flow
entry: research

teams:
  research:
    team: research_team
    coordinator: true
    inputs:
      user_message: true
    on_proceed: [writing]

  writing:
    team: writing_team
    depends_on: [research]
    inputs:
      - from: research
        record: ResearchReport
      - from: research
        record: BlogOutline
    on_proceed: [review]

  review:
    team: review_team
    depends_on: [writing]
    inputs:
      - from: writing
        record: BlogDraft
