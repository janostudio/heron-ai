id: research_team
goal: 同时完成主题调研和文章大纲。

members:
  research_topic:
    type: subagent
    agent: researcher
    responsibility: 调研用户给出的主题，搜索知识库并记录事实依据。
    inputs:
      user_message: true
    output:
      record: ResearchReport

  plan_outline:
    type: subagent
    agent: planner
    responsibility: 根据用户主题设计详细博客大纲。
    inputs:
      user_message: true
    output:
      record: BlogOutline

output:
  records:
    - from: research_topic
      record: ResearchReport
      scope: flow
    - from: plan_outline
      record: BlogOutline
      scope: flow
