id: review_team
goal: 审校并润色博客文章。

calls:
  review_blog:
    type: agent
    agent: editor
    responsibility: 审校 BlogDraft，检查语法、结构、SEO、事实准确性和可读性，输出最终版本。
    inputs:
      - from: writing
        record: BlogDraft
    output:
      record: FinalBlog

output:
  from: review_blog
  record: FinalBlog
  scope: flow
