name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test ./...

      - name: Cross-compile
        # -s -w drops the symbol table and DWARF: 37 MB -> 28 MB per platform,
        # about 26% less to download. Nothing a running engine needs goes with
        # it — panic traces, log fields and runtime.Caller all read .gopclntab,
        # which the linker keeps. Only external debuggers (dlv, gdb on a core
        # dump) need what is removed, and those are not a production concern.
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/v}" -o dist/heron-linux-amd64     ./cmd/server/
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/v}" -o dist/heron-linux-arm64     ./cmd/server/
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/v}" -o dist/heron-darwin-amd64    ./cmd/server/
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/v}" -o dist/heron-darwin-arm64    ./cmd/server/
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/v}" -o dist/heron-windows-amd64.exe ./cmd/server/

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Build npm packages
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # 二进制随平台包发布，主包只带包装脚本；版本由 tag 注入，
          # 模板里的 0.0.0-dev 只作占位（脚本会拒绝按占位版本发布）。
          node npm/make-platform-packages.js --dist dist --out npm-dist --version "$VERSION"

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # npm 对无效/过期的 token 返回 404（"'<pkg>@<version>' is not in this registry"）
          # 而不是 401，看起来像"包不存在/没权限发布"，极易误诊。发布前先确认 token 有效，
          # 失败就明确报认证问题并终止，不让 publish 带着坏 token 继续。
          npm whoami || { echo "::error::NPM_TOKEN 无效或已过期（npm whoami 失败）；请到 npm 账户重新生成 token 并更新仓库 secret NPM_TOKEN"; exit 1; }
          VERSION=${GITHUB_REF#refs/tags/v}
          # 平台包是同一包名的预发布版本（<version>-<platform>），必须显式 --tag：
          # npm publish 默认把版本挂到 latest，那样 `npm install <pkg>` 会装到某个平台包。
          for dir in npm-dist/platform-*; do
            key="${dir#npm-dist/platform-}"
            echo "::group::publish ${key}"
            ( cd "$dir" && npm publish --access public --tag "platform-${VERSION}-${key}" )
            echo "::endgroup::"
          done

      - name: Publish main package to npm
        run: |
          # 平台包全部发布成功后才发主包：主包的 optionalDependencies 指向它们。
          cd npm-dist/main
          npm publish --access public
