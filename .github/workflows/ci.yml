name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Docs links
        # Renaming a doc without fixing its referrers used to be invisible until
        # a reader hit the 404. This turns it into a red build.
        run: python3 scripts/check-docs-links.py --verbose

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a new golangci-lint release can add a linter
          # to the default set and turn unchanged code red. The linter set is
          # declared in .golangci.yml; bump this deliberately.
          version: v2.13.2
