id: frontdesk_team
goal: 与用户对话；能自己回答就回答，需要执行时把任务派给 worker。

calls:
  answer:
    type: agent
    agent: frontdesk
    responsibility: 理解用户诉求；可以直接回答，也可以调用 Team 工具把任务派给 worker
    inputs:
      user_message: true
    output:
      record: FrontdeskReply

output:
  from: answer
  record: FrontdeskReply
